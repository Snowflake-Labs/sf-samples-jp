# 呼び出し口の点検（k_lint）の語の一覧。文書に依存しない約款の語だけを置く。
# negated_requirement：支払の手続・医療の行為が「無いこと」を述べる真偽の入力。
#   行為の語（requirement_acts）の後、句の区切りまでに否定の語（negations）が続くときに旗を立てる。
#   事故の態様（運転資格を有しない・他覚所見が伴わない・保険料が払い込まれない）は除外事由なので、行為の語に入れない。
requirement_acts: [治療, 指示, 請求, 届出, 届け出, 提出, 承認, 通知, 診断, 同意, 申告, 手続]
negations: [を伴わない, が伴わない, が行われなかった, を行わなかった, を受けていない, を受けなかった, がない, が無い,
            されなかった, しなかった, を得ていない, を得なかった, がなかった, が無かった]
max_gap: 12      # 行為の語と否定の語の間に入ってよい文字数（句読点を含まない）
# example_quantity_unused：設例の文の「〜の額が{値}」の量が、カードのどの入力にも写らない。
example_quantity_kinds: [額, 金額, 合計額, 日数, 月数]
stop_chars: のためにしたがはをとでなっ   # 量の語の 2 文字の組から外す助詞・送り仮名
min_overlap: 0.5 # 区別できる 2 文字の組のうち、入力の説明に写る割合の下限
