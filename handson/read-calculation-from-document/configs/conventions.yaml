# 呼び出しの取り決め（両コーパス共通）。文書に依存しない API の規約。
# 合成カードの conventions にそのまま付け、K・D・I・T が参照する。値・規定の内容は含まない。
call: キーワード引数で呼び出す
money: 金額は整数（円）。万円などの単位は円に直した整数で受け渡す
date: 日付の引数と戻り値は datetime.date
bool: 真偽は三値（確定できないときは None）
unknown: >-
  入力が None で結果を確定できないときは None を返す。「かつ」「または」で条件を組む判定は三値論理（Kleene）で、
  ほかの条件だけで結論が決まるなら、None の条件があっても確定した値を返す。
  計算（加減乗除・表引き・日付の計算）は厳密で、不明が混じれば結果も不明とする。表に無いキーは不明とする
days: 日数・月数・年数・時間・分・回数・等級・指数は整数
list: 明細（list）は辞書のリストで、各辞書のキーは fields の name
omitted: >-
  除外事由（該当すれば支払わない・対象外となる事由）の真偽の引数は、呼び出しで渡されなかったときは「該当しない」とみなす。
  None が渡されたときは不明として扱う（渡されなかった場合と区別する）。それ以外の引数は、渡されなければ不明（None）とする
calendar: >-
  営業日を扱う関数は、予約引数 holidays（frozenset[datetime.date]）で祝日を受け取る。祝日をプログラムに書かない。
  土曜・日曜は営業日でないとする。営業日を扱わない関数は holidays を受け取らない
kind: 計算は calculation、可否・該当性の判定は decision とする
units: [JPY, DAY, MONTH, YEAR, HOUR, MIN, COUNT, GRADE, INDEX]
