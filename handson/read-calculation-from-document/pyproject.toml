[project]
name = "jpcalc"
version = "0.1.0"
description = "日本語の文書（保険約款・契約書）の PDF から計算・判定のプログラムを作るハンズオンのパイプライン"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 設定とデータの取得
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "huggingface_hub>=0.24",
    # PDF の読み取り（pdfread/ が使う）
    "pdfplumber>=0.11",
    # Snowflake への接続
    "snowflake-connector-python>=3.12",
    "jsonschema>=4.26.0",
    # 評価ジョブ：正解のテストを実行する（予測には使わない）
    "pytest>=8.0",
]

[project.scripts]
jpcalc = "jpcalc.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
opt = [
    "cmaes>=0.13.1",
    "matplotlib>=3.9",
    "optuna>=5.0.0",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jpcalc"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "out", "work", "logs", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 行の長さは ruff format が揃える。E501 は全角を幅 2 で数え、日本語の docstring・メッセージで過剰に出るので外す
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 移植した読み取りのコードは判定のロジックを書き換えない。書き方の簡略化を求める SIM は適用しない
"src/jpcalc/pdfread/**" = ["SIM"]
# 移植した予測の段のコード：入れ子の関数は同じ周回の中でだけ呼ぶ（B023 は誤検出）
"src/jpcalc/predict/**" = ["SIM", "B023", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration and not network' -ra"
markers = [
    "network: Hugging Face に実際に接続する試験（既定で除外。`uv run pytest -m network` で実行）",
    "integration: Snowflake の検証用接続を使う試験（既定で除外。`uv run pytest -m integration` で実行）",
]
