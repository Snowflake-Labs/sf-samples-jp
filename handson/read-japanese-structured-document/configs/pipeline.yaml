# パイプライン共通の設定。コーパス固有の値は configs/corpora/<name>.yaml に置く。

# 図（S40）の AI_COMPLETE の条件。移植元と同じ値
figure:
  model: claude-opus-5
  prompt_version: p4_graph_v2   # read/figures.py の PROMPT_VERSION と一致させる（setup が照合する）
  max_tokens_min: 4096
  max_tokens_per_node: 180      # max_tokens = max(min, 予測ノード候補数 × 2 × per_node)。正解の要素数は使わない
  retry_parse_error: 1          # 解析できない出力の再試行回数（画像入力は temperature 0 でも非決定。移植元 F6b）

# 見込みクレジットの単価（移植元の実測）。表示と確認プロンプトに使う目安で、請求額ではない
cost:
  parse_layout_credits_per_page: 0.0037
  figure_credits_per_call: 0.042

# 対象文書の指定が無いときのスライスと、実行前に確認を求めるスライス
defaults:
  slice: pilot
  confirm_slices: [all]
