# jyusetsu（重要事項説明書）の見出し文法
#
# **これは約款ではない。** 条・章という語を使わず、番号だけで階層を作る。
# gold の引用は `2 (2) ② ①` の形で、ラベルは**印字されたまま**。
#
#   chapter  '1'    裸の数字        例 `1用語のご説明`
#   section  '(1)'  半角括弧        例 `(1)商品の仕組み`
#   article  '①'    丸数字          例 `①この保険の型と補償の組み合わせ`
#   item     '①'    丸数字（条の下でもう一段。番号が 1 に戻ることで見分ける）
#   paragraph        ラベルなしの散文（gold は 63 件すべて空ラベル）
#
# **article と item は同じ字形である。** 区別できるのは番号の単調性だけなので、
# 判定は番号制約（リセットは親の境界の直後だけ）に委ねる（詳細は grammars.py）。
name: jyusetsu

patterns:
  chapter: '^([0-9０-９]{1,2})(\S.*)$'
  # 括弧は半角と全角の両方（F17：v7 の新しい content は `（１）` と全角で刷る。半角だけだと節が開かない）。
  # 種類の混ざった `(１）` も通るが、実データに無く害も小さいので 1 つの文字クラスにしている（F17 レビュー）
  section: '^([(（][0-9０-９]+[)）])(\S.*)$'
  article: '^([①-⑳])(\S.*)$'

# 目次行の否定規則。`もくじ` は本文と同じ見出し文字列を並べ、末尾にページ番号を置く
# （`1用語のご説明2`・`①主な用語と略称2`）。約款の `RE_TOC_ENTRY` は `第N章` 系の
# 語尾を前提にしているので当たらない。**この体裁専用の規則が要る。**
toc_entry: '^(?:[0-9０-９]{1,2}|[(（][0-9０-９]+[)）]|[①-⑳]).*[0-9０-９]{1,3}$'

# 版式推定。gold の `meta.numbering_scheme` は予測時に
# 使えない（§1.4 の gold-blind）ので、**印字形から決める**。
inference:
  # 約款なら本文に `第N条` が多数ある。1 件も無く、かつ丸数字の見出しが
  # 一定数あれば、この体裁と判断する。
  max_article_kanji_hits: 0
  min_circled_heading_hits: 5
