[project]
name = "car-multimodal-ai-sample"
version = "0.1.0"
description = "Snowflake E2E reference: comma2k19 raw ingestion -> multimodal (sensor+image) lead-distance estimation, built entirely on Snowflake ML"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2,<3",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pyyaml>=6",
    "tqdm>=4.66",
    "av>=12",
    "pillow>=10",
    "click>=8",
    "huggingface_hub>=0.24",
    "snowflake-snowpark-python>=1.20",
    "snowflake-ml-python>=1.9.2",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"jobs/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
